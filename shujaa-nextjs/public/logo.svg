<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- Background pill/badge -->
  <rect width="320" height="72" fill="none"/>

  <!-- Acacia tree icon (coral) -->
  <g transform="translate(14, 8)">
    <!-- trunk -->
    <rect x="21" y="34" width="3" height="20" fill="#dc7855" rx="1"/>
    <!-- main canopy umbrella -->
    <ellipse cx="22.5" cy="22" rx="18" ry="10" fill="#dc7855"/>
    <!-- canopy cut-outs for organic look -->
    <ellipse cx="10" cy="26" rx="8" ry="6" fill="#dc7855"/>
    <ellipse cx="35" cy="26" rx="8" ry="6" fill="#dc7855"/>
    <!-- inner shadow / depth -->
    <ellipse cx="22.5" cy="24" rx="12" ry="7" fill="#c46444" opacity="0.4"/>
    <!-- ground line -->
    <line x1="8" y1="54" x2="37" y2="54" stroke="#dc7855" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- SAVANNA wordmark -->
  <text x="68" y="34"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    letter-spacing="4"
    fill="#ffffff"
    text-anchor="start">SAVANNA</text>

  <!-- Thin divider line -->
  <line x1="68" y1="40" x2="308" y2="40" stroke="#2d5240" stroke-width="1"/>

  <!-- & MARE ADVENTURES subtext -->
  <text x="68" y="57"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    font-weight="400"
    letter-spacing="5"
    fill="#6a9e7f"
    text-anchor="start">&amp; MARE ADVENTURES</text>
</svg>

